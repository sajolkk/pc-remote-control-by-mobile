# The Flutter template asks for an 8 GB heap and a 4 GB metaspace. That is far more than an
# Android build of this size needs, and it fails outright on a machine that does not have that
# much free — which is most machines with a browser and an IDE open. 2 GB is comfortable here.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=1024m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError

# Keep the daemon from lingering with a large heap after a build.
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Kotlin incremental compilation is disabled.
#
# Its caches are memory-mapped .tab files, and on a memory-constrained machine the compiler fails
# with "Could not close incremental caches" — which surfaces as an opaque
# "Daemon compilation failed" with no source-level error to chase. Incremental compilation only
# speeds up repeat builds of plugin Kotlin that we never edit, so turning it off costs almost
# nothing and removes a whole class of spurious build failure.
kotlin.incremental=false

# Keep the Kotlin compile daemon's heap modest for the same reason as the Gradle heap above.
kotlin.daemon.jvmargs=-Xmx1024m
